server:
  port: 8082

spring:
  application:
    name: stage-service

  datasource:
    url: ${SPRING_DATASOURCE_URL}
    username: ${SPRING_DATASOURCE_USERNAME}
    password: ${SPRING_DATASOURCE_PASSWORD}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect

  servlet:
    multipart:
      max-file-size: 20MB
      max-request-size: 20MB

jwt:
  secret: ${JWT_SECRET}

# =========================
# FILE STORAGE CONFIG
# =========================
app:
  upload:
    dir: ${APP_UPLOAD_DIR:/app/uploads/stage}

# =========================
# FEIGN CONFIG
# =========================
auth:
  service:
    url: ${AUTH_SERVICE_URL:http://auth-service:8081}

# =========================
# ACTUATOR / PROBES
# =========================
management:
  endpoints:
    web:
      exposure:
        include: health, info

  endpoint:
    health:
      # ✅ Active les endpoints /actuator/health/liveness et /readiness
      probes:
        enabled: true
      show-details: always
      group:
        # liveness  → vérifie uniquement que la JVM est vivante
        # utilisé par startupProbe + livenessProbe dans le Deployment
        liveness:
          include: livenessState, ping
        # readiness → vérifie que la DB est joignable avant d'accepter du trafic
        # utilisé par readinessProbe dans le Deployment
        readiness:
          include: readinessState, db

  health:
    livenessState:
      enabled: true
    readinessState:
      enabled: true

# Endpoints disponibles après déploiement :
#   GET /actuator/health/liveness  → 200 UP  (JVM vivante, indépendant DB)
#   GET /actuator/health/readiness → 200 UP  (DB connectée)
#   GET /actuator/health           → vue globale