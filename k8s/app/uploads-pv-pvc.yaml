apiVersion: v1
kind: PersistentVolume
metadata:
  name: uploads-pv
  labels:
    app: stage-service
spec:
  # ✅ local-path = provisioner natif K3s (rancher.io/local-path)
  storageClassName: local-path
  capacity:
    storage: 5Gi
  accessModes:
    - ReadWriteOnce
  persistentVolumeReclaimPolicy: Retain
  hostPath:
    path: /data/uploads/stage
    type: DirectoryOrCreate
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: uploads-pvc
  namespace: gestion-projet
spec:
  # ✅ Doit correspondre exactement au storageClassName du PV ci-dessus
  storageClassName: local-path
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 5Gi
  selector:
    matchLabels:
      app: stage-service