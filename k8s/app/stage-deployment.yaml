apiVersion: apps/v1
kind: Deployment
metadata:
  name: stage-deployment
  namespace: gestion-projet
spec:
  replicas: 1
  selector:
    matchLabels:
      app: stage-service
  template:
    metadata:
      labels:
        app: stage-service
    spec:
      securityContext:
        runAsUser: 0
        fsGroup: 0

      initContainers:
        - name: init-uploads
          image: busybox
          command:
            - sh
            - -c
            - mkdir -p /app/uploads/stage && chmod 777 /app/uploads/stage
          volumeMounts:
            - name: uploads-storage
              mountPath: /app/uploads/stage

      containers:
        - name: stage-service
          image: nour292/stage-service:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 8082

          env:
            - name: SPRING_DATASOURCE_URL
              valueFrom:
                secretKeyRef:
                  name: stage-secrets
                  key: STAGE_DB_URL
            - name: SPRING_DATASOURCE_USERNAME
              valueFrom:
                secretKeyRef:
                  name: stage-secrets
                  key: STAGE_DB_USERNAME
            - name: SPRING_DATASOURCE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: stage-secrets
                  key: STAGE_DB_PASSWORD
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: stage-secrets
                  key: JWT_SECRET
            - name: AUTH_SERVICE_URL
              valueFrom:
                configMapKeyRef:
                  name: stage-config
                  key: AUTH_SERVICE_URL
            - name: APP_UPLOAD_DIR
              valueFrom:
                configMapKeyRef:
                  name: stage-config
                  key: APP_UPLOAD_DIR

          volumeMounts:
            - name: uploads-storage
              mountPath: /app/uploads/stage

          # ✅ CORRECTION 1 : startupProbe sur /liveness (ping uniquement)
          #    failureThreshold 30→60 = 10 minutes pour Spring Boot + Neon DB
          startupProbe:
            httpGet:
              path: /actuator/health/liveness
              port: 8082
            failureThreshold: 60
            periodSeconds: 10

          # ✅ CORRECTION 2 : readinessProbe sur /readiness (vérifie la DB)
          #    Le pod ne reçoit du trafic que quand la DB répond
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: 8082
            initialDelaySeconds: 0
            periodSeconds: 15
            failureThreshold: 4
            successThreshold: 1

          # ✅ CORRECTION 3 : livenessProbe sur /liveness uniquement
          #    Ne redémarre pas le pod si Neon DB est temporairement lente
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: 8082
            initialDelaySeconds: 0
            periodSeconds: 30
            failureThreshold: 3

          # ✅ AJOUT : limits pour éviter un OOMKill silencieux
          resources:
            requests:
              memory: "256Mi"
              cpu: "250m"
            limits:
              memory: "512Mi"
              cpu: "1000m"

      volumes:
        - name: uploads-storage
          persistentVolumeClaim:
            claimName: uploads-pvc
---
apiVersion: v1
kind: Service
metadata:
  name: stage-service
  namespace: gestion-projet
spec:
  type: ClusterIP
  selector:
    app: stage-service
  ports:
    - port: 8082
      targetPort: 8082